<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Threat Modeling: métodos, fontes e evidência</title>
  <desc id="d">Diagrama de fluxo com uma fronteira de confiança tracejada. Uma seta marcada como ameaça cruza a fronteira. Abaixo, os graus de fonte A a E.</desc>
